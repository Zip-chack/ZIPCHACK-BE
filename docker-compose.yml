services:
  mysql:
    image: mysql:8.0
    container_name: minyou-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: zip_chack
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/database/zipchack_db.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/main/resources/database/insert_sample_data.sql:/docker-entrypoint-initdb.d/02_data.sql
    networks:
      - minyou-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minyou-backend
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-MINYOU}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:mysql://mysql:3306/zip_chack?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://172.31.11.244:8001}
    volumes:
      - ./.env:/app/.env:ro
    ports:
      - "${SERVER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - minyou-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  minyou-network:
    driver: bridge
